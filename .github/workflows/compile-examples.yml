name: compile-examples

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  # Host-side unit tests: verify the logic actually computes correctly
  # (tick math, elapsed time, and the NTP -> RFC3339 date conversion).
  native-test:
    name: native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build & run
        run: ./test/run.sh

  compile:
    name: ${{ matrix.board.fqbn }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        board:
          # 8-bit AVR: FastTimer + NTP over Ethernet (odr-use of the
          # static constexpr tables must link under gnu++11).
          - fqbn: arduino:avr:uno
            platforms: |
              - name: arduino:avr
            libraries: |
              - source-path: ./
              - name: Ethernet
            sketches: |
              - examples/offline
              - examples/ticks
              - examples/ethernet

          # ESP8266: WiFi examples (ESP8266WiFi is bundled with the core).
          - fqbn: esp8266:esp8266:nodemcuv2
            platforms: |
              - name: esp8266:esp8266
                source-url: https://arduino.esp8266.com/stable/package_esp8266com_index.json
            libraries: |
              - source-path: ./
            sketches: |
              - examples/offline
              - examples/ticks
              - examples/wifi
              - examples/wifiRt

          # ESP32: FastTimer + NTP over Ethernet.
          - fqbn: esp32:esp32:esp32
            platforms: |
              - name: esp32:esp32
                source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
            libraries: |
              - source-path: ./
              - name: Ethernet
            sketches: |
              - examples/offline
              - examples/ticks
              - examples/ethernet

    steps:
      - uses: actions/checkout@v4

      - uses: arduino/compile-sketches@v1
        with:
          fqbn: ${{ matrix.board.fqbn }}
          platforms: ${{ matrix.board.platforms }}
          libraries: ${{ matrix.board.libraries }}
          sketch-paths: ${{ matrix.board.sketches }}
